global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "rules.yml"

scrape_configs:
  - job_name: "churn_api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          servicio: "churn-api"

  - job_name: "evidently_exporter"
    metrics_path: /metrics
    static_configs:
      - targets: ["evidently:8001"]
        labels:
          servicio: "evidently"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]